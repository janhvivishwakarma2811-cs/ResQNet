spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resqnet_db
    driver-class-name: org.postgresql.Driver
    username: resqnet_user
    password: resqnet_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
