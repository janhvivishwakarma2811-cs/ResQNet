version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: resqnet-postgres
    restart: always
    environment:
      POSTGRES_DB: resqnet_db
      POSTGRES_USER: resqnet_user
      POSTGRES_PASSWORD: resqnet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqnet_user -d resqnet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
